<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Кейс | MetroDrop</title>
	<link rel="stylesheet" href="style.css">
	<script src="supabase.js"></script>
	<script src="script.js" defer></script>
</head>
<body class="case-body">
	<div class="background-overlay" aria-hidden="true"></div>

	<header class="site-header">
		<a class="brand" href="home.html" aria-label="MetroDrop - главная">
			<img class="brand-logo" src="img/logo.png" alt="MetroDrop">
		</a>

		<nav class="main-nav" id="main-menu" aria-label="Основная навигация">
			<a class="nav-link" href="home.html#login">АВТОРИЗАЦИЯ</a>
			<a class="nav-link is-active" href="home.html#cases">КЕЙСЫ</a>
			<a class="nav-link" href="home.html#market">РЫНОК</a>
			<a class="nav-link" href="workbench.html">ВЕРСТАК</a>
			<a class="nav-link" href="contract.html">КОНТРАКТ</a>

			<div class="mobile-menu-panel" aria-label="Меню пользователя">
				<a class="mobile-menu-item" href="home.html#login">АВТОРИЗАЦИЯ</a>
				<a class="mobile-menu-item" href="home.html#cases">КЕЙСЫ</a>
				<a class="mobile-menu-item" href="workbench.html">ВЕРСТАК</a>
				<a class="mobile-menu-item" href="upgrade.html">АПГРЕЙД</a>
				<a class="mobile-menu-item" href="contract.html">КОНТРАКТ</a>
				<a class="mobile-menu-item gold-menu-item" href="home.html#events">СОБЫТИЯ</a>
				<img class="mobile-menu-decoration" src="img/img_menu.png" alt="" aria-hidden="true">
			</div>
		</nav>

		<div class="header-actions">
			<div class="balance-card" data-balance-card role="button" tabindex="0" aria-label="Переключить валюту">
				<span class="balance" data-balance>0</span>
				<img class="balance-currency" data-balance-currency src="img/metro_money.png" alt="Метровалюты">
			</div>
			<a class="login-button" href="home.html#login">ВОЙТИ</a>
			<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
				<span class="menu-icon" aria-hidden="true">
					<span></span>
					<span></span>
					<span></span>
				</span>
				<span class="visually-hidden">Открыть меню</span>
			</button>
		</div>
	</header>

	<main class="case-page">
		<section class="case-detail" aria-live="polite">
			<p class="case-status">ЗАГРУЗКА КЕЙСА</p>
		</section>
	</main>
	<script>
		const detail = document.querySelector(".case-detail");
		const caseId = new URLSearchParams(window.location.search).get("id");

		const renderError = (message) => {
			detail.innerHTML = `<h1>КЕЙС НЕ НАЙДЕН</h1><p>${message}</p>`;
		};

		const renderCase = (item) => {
			const contents = (Array.isArray(item.contents) ? item.contents : []).map((value) => typeof value === "string"
				? { name: value, image: item.image, price: Number(item.price) || 0, rarity: "common", rarityLabel: "ОБЫЧНЫЙ" }
				: { ...value, image: value.image || item.image, price: Number(value.price ?? item.price ?? 0) || 0, rarity: value.rarity || "common", rarityLabel: value.rarityLabel || "ОБЫЧНЫЙ" });
			detail.replaceChildren();
			const hero = document.createElement("div");
			hero.className = "case-hero";
			const media = document.createElement("div");
			media.className = "case-detail-media";
			const image = document.createElement("img");
			image.src = item.image;
			image.alt = item.name;
			media.append(image);
			hero.append(media);

			const actionPanel = document.createElement("div");
			actionPanel.className = "case-action-panel";
			const openButton = document.createElement("button");
			openButton.type = "button";
			openButton.className = "case-open-button";
			const casePrice = Number(item.price) || 0;
			const openCounts = [1, 2, 5, 10];
			let selectedOpenCount = 1;
			const getCurrencyIconSrc = () => {
				return localStorage.getItem("metroDropCurrencyMode") === "uc" ? "img/uc.png" : "img/metro_money.png";
			};
			const formatCaseTotalPrice = (total) => {
				const mode = localStorage.getItem("metroDropCurrencyMode") === "uc" ? "uc" : "metro";
				if (mode === "uc") {
					return (total * 60 / 100000).toFixed(2).replace(/\.00$/, "");
				}
				return String(Math.round(total));
			};
			const updateOpenButtonText = () => {
				const totalPrice = casePrice * selectedOpenCount;
				const actionLabel = document.createElement("span");
				actionLabel.textContent = "ОТКРЫТЬ ЗА";
				const priceGroup = document.createElement("span");
				priceGroup.className = "case-price-group";
				const priceText = document.createElement("span");
				priceText.textContent = formatCaseTotalPrice(totalPrice);
				const currencyIcon = document.createElement("img");
				currencyIcon.src = getCurrencyIconSrc();
				currencyIcon.alt = localStorage.getItem("metroDropCurrencyMode") === "uc" ? "UC" : "Метровалюты";
				currencyIcon.className = "case-price-icon";
				priceGroup.append(priceText, currencyIcon);
				openButton.replaceChildren(actionLabel, priceGroup);
			};
			window.updateCaseActionPrice = () => {
				if (openButton) {
					updateOpenButtonText();
				}
			};
			updateOpenButtonText();

			const reel = document.createElement("div");
			reel.className = "case-reel";
			reel.setAttribute("aria-live", "polite");
			const reelPointer = document.createElement("div");
			reelPointer.className = "case-reel-pointer";
			const reelTrack = document.createElement("div");
			reelTrack.className = "case-reel-track";
			reel.append(reelPointer, reelTrack);
			let spinning = false;
			let audioContext = null;
			const rewardSound = new Audio("sounds/reward.mp3");
			rewardSound.preload = "auto";
			rewardSound.volume = 0.9;
			const reelCards = contents.length ? contents : [{ name: "Содержимое пока не добавлено", image: item.image, rarity: "common" }];
			const cardWidth = 150;
			const cardGap = 8;
			const cardStep = cardWidth + cardGap;

			const playCardClick = () => {
				if (!audioContext) {
					return;
				}
				const now = audioContext.currentTime;
				const master = audioContext.createGain();
				master.gain.setValueAtTime(0.0001, now);
				master.gain.exponentialRampToValueAtTime(0.065, now + 0.006);
				master.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);
				master.connect(audioContext.destination);
				const oscillator = audioContext.createOscillator();
				const gain = audioContext.createGain();
				oscillator.type = "triangle";
				oscillator.frequency.setValueAtTime(76, now);
				oscillator.frequency.exponentialRampToValueAtTime(42, now + 0.075);
				gain.gain.value = 0.8;
				oscillator.connect(gain).connect(master);
				oscillator.start(now);
				oscillator.stop(now + 0.09);
			};

			const initReelAudio = () => {
				const AudioContext = window.AudioContext || window.webkitAudioContext;
				if (!AudioContext) {
					return;
				}
				audioContext ||= new AudioContext();
				if (audioContext.state === "suspended") {
					audioContext.resume();
				}
			};

			const createReelCards = () => {
				reelTrack.replaceChildren();
				const winnerIndex = 78;
				const winnerValue = reelCards[Math.floor(Math.random() * reelCards.length)];
				for (let index = 0; index < 110; index += 1) {
					const value = index === winnerIndex
						? winnerValue
						: reelCards[Math.floor(Math.random() * reelCards.length)];
					const card = document.createElement("div");
					card.className = `case-reel-card rarity-${value.rarity || "common"}`;
					const cardImage = document.createElement("img");
					cardImage.src = value.image || item.image;
					cardImage.alt = value.name || "Предмет";
					card.append(cardImage);
					reelTrack.append(card);
				}
			};

			const spinReel = () => {
				if (spinning) {
					return;
				}
				spinning = true;
				media.classList.add("is-opening");
				openButton.disabled = true;
				countGroup.querySelectorAll(".case-open-count").forEach((button) => { button.disabled = true; });
				openButton.classList.remove("is-opened");
				initReelAudio();
				createReelCards();
				reel.classList.add("is-visible");
				reel.classList.remove("has-result");
				reelTrack.style.transition = "none";
				reelTrack.style.transform = "translateX(0px)";
				reelTrack.offsetWidth;
				const winnerIndex = 78;
				const targetWinner = reelTrack.children[winnerIndex];
				const finalX = reel.clientWidth / 2 - (targetWinner.offsetLeft + targetWinner.offsetWidth / 2);
				const startTime = performance.now();
				let lastCard = 0;
				const animate = (now) => {
					const progress = Math.min((now - startTime) / 5600, 1);
					const eased = 1 - Math.pow(1 - progress, 3);
					const currentX = finalX * eased;
					reelTrack.style.transform = `translateX(${currentX}px)`;
					const currentCard = Math.floor((reel.clientWidth / 2 - currentX) / cardStep);
					if (Math.abs(currentX) > 8 && currentCard !== lastCard) {
						if (Math.abs(currentCard - lastCard) <= 2) {
							playCardClick();
						}
						lastCard = currentCard;
					}
					if (progress < 1) {
						requestAnimationFrame(animate);
						return;
					}
					const reelCenter = reel.getBoundingClientRect().left + reel.clientWidth / 2;
					const winner = Array.from(reelTrack.children).reduce((closest, card) => {
						const cardCenter = card.getBoundingClientRect().left + card.offsetWidth / 2;
						const closestDistance = Math.abs((closest.getBoundingClientRect().left + closest.offsetWidth / 2) - reelCenter);
						return Math.abs(cardCenter - reelCenter) < closestDistance ? card : closest;
					});
					winner.classList.add("is-winner");
					reel.classList.add("has-result");
					rewardSound.currentTime = 0;
					rewardSound.play().catch(() => {});
					const centeredX = reel.clientWidth / 2 - (winner.offsetLeft + winner.offsetWidth / 2);
					reelTrack.style.transition = "transform .3s cubic-bezier(.2, .8, .2, 1)";
					reelTrack.style.transform = `translateX(${centeredX}px)`;
					window.setTimeout(() => {
						spinning = false;
						openButton.disabled = false;
						countGroup.querySelectorAll(".case-open-count").forEach((button) => { button.disabled = false; });
						openButton.classList.add("is-opened");
					}, 320);
				};
				requestAnimationFrame(animate);
			};
			openButton.addEventListener("click", spinReel);
			media.append(reel);

			const countGroup = document.createElement("div");
			countGroup.className = "case-open-counts";
			openCounts.forEach((count) => {
				const countButton = document.createElement("button");
				countButton.type = "button";
				countButton.className = "case-open-count";
				countButton.textContent = String(count);
				if (count === selectedOpenCount) {
					countButton.classList.add("is-selected");
				}
				countButton.addEventListener("click", () => {
					selectedOpenCount = count;
					countGroup.querySelectorAll(".case-open-count").forEach((button) => button.classList.toggle("is-selected", Number(button.textContent) === selectedOpenCount));
					openButton.classList.remove("is-opened");
					updateOpenButtonText();
				});
				countGroup.append(countButton);
			});

			actionPanel.append(openButton, countGroup);
			hero.append(actionPanel);
			detail.append(hero);

			const grid = document.createElement("div");
			grid.className = "case-content-grid inventory-grid";
			(contents.length ? contents : [{ name: "Содержимое пока не добавлено", image: item.image, rarity: "common", rarityLabel: "ОБЫЧНЫЙ" }]).forEach((value) => {
				const entry = document.createElement("div");
				entry.className = `inventory-slot has-item rarity-${value.rarity}`;
				entry.setAttribute("aria-label", value.name || "Предмет");
				const itemImage = document.createElement("img");
				itemImage.className = "inventory-item-image";
				itemImage.src = value.image || item.image;
				itemImage.alt = value.name || "Предмет";
				entry.append(itemImage);

				const itemPrice = document.createElement("span");
				itemPrice.className = "case-item-price";
				const formatItemPrice = (priceValue) => {
					const mode = localStorage.getItem("metroDropCurrencyMode") === "uc" ? "uc" : "metro";
					const rawValue = Number(priceValue) || 0;
					if (mode === "uc") {
						return (rawValue * 60 / 100000).toFixed(2).replace(/\.00$/, "");
					}
					return String(Math.round(rawValue));
				};
				const safePrice = Number(value.price ?? item.price ?? 0) || 0;
				entry.dataset.itemPrice = String(safePrice);
				const updateItemPriceText = () => {
					const rawValue = Number(entry.dataset.itemPrice || 0) || 0;
					itemPrice.replaceChildren();
					const valueText = document.createElement("span");
					valueText.textContent = formatItemPrice(rawValue);
					const icon = document.createElement("img");
					icon.src = localStorage.getItem("metroDropCurrencyMode") === "uc" ? "img/uc.png" : "img/metro_money.png";
					icon.alt = localStorage.getItem("metroDropCurrencyMode") === "uc" ? "UC" : "Метровалюты";
					icon.className = "case-price-icon";
					itemPrice.append(valueText, icon);
				};
				updateItemPriceText();
				entry.append(itemPrice);
				window.updateCaseItemPrices = () => {
					const currentPrices = document.querySelectorAll(".case-item-price");
					currentPrices.forEach((priceNode) => {
						const slot = priceNode.closest(".inventory-slot");
						const rawValue = Number(slot?.dataset.itemPrice || 0) || 0;
						const valueText = document.createElement("span");
						valueText.textContent = formatItemPrice(rawValue);
						const icon = document.createElement("img");
						icon.src = localStorage.getItem("metroDropCurrencyMode") === "uc" ? "img/uc.png" : "img/metro_money.png";
						icon.alt = localStorage.getItem("metroDropCurrencyMode") === "uc" ? "UC" : "Метровалюты";
						icon.className = "case-price-icon";
						priceNode.replaceChildren(valueText, icon);
					});
				};

				const itemName = document.createElement("span");
				itemName.className = "case-item-name";
				itemName.textContent = value.name || "Предмет";
				entry.append(itemName);

				const rarity = document.createElement("span");
				rarity.className = "inventory-rarity";
				entry.append(rarity);
				grid.append(entry);
			});
			detail.append(grid);
			window.updateCaseItemPrices?.();
		};

		(async () => {
			if (!caseId) {
				renderError("В ссылке отсутствует идентификатор кейса.");
				return;
			}
			try {
				const { cases } = await window.metroDropSupabase.load();
				const item = cases.find((entry) => entry.id === caseId);
				if (!item) {
					renderError("Этот кейс больше недоступен.");
					return;
				}
				renderCase(item);
			} catch (error) {
				renderError("Не удалось загрузить данные кейса.");
				console.error(error);
			}
		})();
	</script>
</body>
</html>
